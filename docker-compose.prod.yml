services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'deploytask-prod/app'
        restart: always
        ports:
            - '8086:80'
        env_file:
            - .env
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            SERVER_NAME: ':80'
        volumes:
            - caddy_data:/data
            - caddy_config:/config
        networks:
            - production-net
        depends_on:
            - pgsql
            - redis

    pgsql:
        image: 'postgres:18-alpine'
        restart: always
        env_file:
            - .env
        environment:
            PGPASSWORD: '${DB_PASSWORD}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - prod-db-data:/var/lib/postgresql/data
        networks:
            - production-net

    redis:
        image: 'redis:alpine'
        restart: always
        volumes:
            - prod-redis-data:/data
        networks:
            - production-net

networks:
    production-net:
        driver: bridge

volumes:
    prod-db-data:
    prod-redis-data:
    caddy_data:
    caddy_config:
