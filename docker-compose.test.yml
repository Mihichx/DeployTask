version: '3'
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: 'deploytask-prod/app'
        ports:
            - '8080:80' # Пробросим на порт 8080, чтобы не конфликтовать с Sail
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            # Указываем FrankenPHP работать по обычному HTTP без домена
            SERVER_NAME: ':80'
            DB_CONNECTION: pgsql
            DB_HOST: pgsql
            DB_PORT: 5432
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
        networks:
            - test-net
        depends_on:
            - pgsql
            - redis

    pgsql:
        image: 'postgres:18-alpine'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - db-test-data:/var/lib/postgresql
        networks:
            - test-net

    redis:
        image: 'redis:alpine'
        networks:
            - test-net

networks:
    test-net:
        driver: bridge

volumes:
    db-test-data:
